<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkipWebAuthn</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  width:490px;
  min-height:220px;
  background:#1e1e1e;
  color:#f2f2f2;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:13px;
  line-height:1.5;
}

header{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 16px;
  background:#272727;
  border-bottom:1px solid #383838;
}
header svg{flex-shrink:0}
.title{font-size:14px;font-weight:700;color:#fb923c;letter-spacing:.01em}
.origin{
  font-size:11px;
  color:#999;
  margin-left:auto;
  max-width:145px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.lang-switcher{display:flex;gap:3px;margin-left:8px;flex-shrink:0}
.lang-switcher button{
  background:#2e2e2e;
  border:1px solid #484848;
  color:#999;
  border-radius:4px;
  padding:3px 9px;
  font-size:10px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  letter-spacing:.06em;
  transition:all .15s;
}
.lang-switcher button:hover{color:#eee;border-color:#666}
.lang-switcher button.active{background:#7c2d00;border-color:#ea580c;color:#fb923c}

.section{padding:14px 16px;border-bottom:1px solid #2e2e2e}
.section-label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:#bbb;margin-bottom:9px;
}

textarea{
  width:100%;height:72px;resize:vertical;
  background:#2a2a2a;border:1px solid #484848;border-radius:7px;
  color:#f2f2f2;font-family:'Courier New',monospace;font-size:11.5px;
  padding:8px 10px;outline:none;transition:border-color .2s,background .2s;
}
textarea:focus{border-color:#ea580c;background:#2f2f2f}
textarea::placeholder{color:#666}

.btn-row{display:flex;gap:8px;margin-top:9px}

button{
  cursor:pointer;border:none;border-radius:7px;
  padding:7px 16px;font-size:12px;font-weight:600;
  font-family:inherit;transition:filter .15s;white-space:nowrap;
}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){filter:brightness(.82)}
button:disabled{opacity:.3;cursor:default}

.btn-primary  {background:#ea580c;color:#fff}
.btn-secondary{background:#333;color:#ddd;border:1px solid #484848}
.btn-danger   {background:#5c1a1a;color:#fca5a5;border:1px solid #7f1d1d}
.btn-success  {background:#14391a;color:#86efac;border:1px solid #166534}
.btn-icon     {padding:4px 10px;font-size:11px}

.msg{font-size:11.5px;margin-top:7px;min-height:16px;color:#4ade80;font-weight:500}
.msg.error{color:#f87171}

.creds-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 0;gap:8px;
}
.creds-left{display:flex;align-items:center;gap:8px;min-width:0}
.badge{
  background:#2a2a2a;color:#ddd;border:1px solid #3e3e3e;
  border-radius:20px;padding:2px 10px;font-size:11px;
  font-weight:600;white-space:nowrap;flex-shrink:0;
}
.creds-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:#f97316;
  flex-shrink:0;animation:pulse 1.8s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.creds-list{
  padding:9px 16px 16px;display:flex;flex-direction:column;
  gap:9px;max-height:360px;overflow-y:auto;
}
.creds-list::-webkit-scrollbar{width:4px}
.creds-list::-webkit-scrollbar-thumb{background:#3e3e3e;border-radius:4px}

.empty{color:#666;font-style:italic;padding:14px 16px 22px;text-align:center}

.cred-card{
  background:#272727;border:1px solid #383838;
  border-radius:9px;padding:11px 13px;transition:border-color .15s;
}
.cred-card:hover{border-color:#555}

.cred-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.algo-tag{
  background:#3d1400;color:#fb923c;border:1px solid #7c2d00;
  border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;flex-shrink:0;
}
.cred-username{
  font-size:13px;font-weight:600;color:#f2f2f2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.cred-username.raw{
  font-family:'Courier New',monospace;font-size:11px;color:#aaa;font-weight:400;
}

.cred-meta{
  display:grid;grid-template-columns:58px 1fr;
  gap:3px 10px;font-size:11.5px;
}
.cred-meta .lbl{color:#777;font-weight:500}
.cred-meta .val{
  font-family:'Courier New',monospace;color:#ddd;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.cred-actions{display:flex;gap:7px;margin-top:10px}

.rpid-group-label{
  font-size:10px;color:#666;text-transform:uppercase;
  letter-spacing:.06em;padding:4px 0 2px;
}
.loading{color:#666;font-style:italic;text-align:center;padding:16px}
</style>
</head>
<body>

<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <span class="title">SkipWebAuthn</span>
  <span class="origin" id="originLabel">—</span>
  <div class="lang-switcher">
    <button data-lang="en">EN</button>
    <button data-lang="ru">RU</button>
  </div>
</header>

<div class="section">
  <div class="section-label" id="importLabel">Import key (JSON)</div>
  <textarea id="importJson"></textarea>
  <div class="btn-row">
    <button class="btn-primary" id="btnImport">Add to site</button>
    <button class="btn-secondary" id="btnClear">Clear</button>
  </div>
  <div class="msg" id="importMsg"></div>
</div>

<div class="creds-header">
  <div class="creds-left">
    <div class="section-label" id="keysHeader" style="margin:0;white-space:nowrap">Site keys</div>
    <span class="badge" id="countBadge">0 / 10</span>
  </div>
  <div class="creds-right">
    <div class="live-dot"></div>
    <button class="btn-success btn-icon" id="btnCopyAll" disabled>Copy all</button>
    <button class="btn-danger btn-icon" id="btnDeleteAll" disabled>Delete all</button>
  </div>
</div>

<div id="credsList"></div>

<script src="popup.js"></script>
</body>
</html>
